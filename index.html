<style>
  :root{
    --bg:#f6f7f9; --card:#ffffff; --text:#101418; --muted:#5b6470; --border:#e3e6ea;
    --accent:#e8590c; --accent-dark:#c94a08;
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
    box-sizing:border-box;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){ --bg:#0f1216; --card:#171b21; --text:#eef1f5; --muted:#9aa3ad; --border:#262b33; }
  }
  :root[data-theme="dark"]{ --bg:#0f1216; --card:#171b21; --text:#eef1f5; --muted:#9aa3ad; --border:#262b33; }
  html{scroll-padding-top:env(safe-area-inset-top,0px);}
  body{background:var(--bg); color:var(--text); font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;}
  .card{background:var(--card); border:1px solid var(--border);}
  .muted{color:var(--muted);}
  .accent{background:var(--accent);}
  .accent:hover{background:var(--accent-dark);}
  .accent-text{color:var(--accent);}
  header{top:env(safe-area-inset-top,0px);}
  .chip{border:1px solid var(--border); background:var(--card);}
  .chip.active{background:var(--accent); color:#fff; border-color:var(--accent);}
  .prod-img{aspect-ratio:1/1; display:flex; align-items:center; justify-content:center; font-size:2.5rem;}
  .drawer{transition:transform .25s ease;}
  .fade{transition:opacity .2s ease;}
  ::-webkit-scrollbar{height:6px; width:6px;}
  .star{color:#f5a623;}
  input,select{background:var(--card); color:var(--text); border:1px solid var(--border);}
</style>

<header class="sticky z-30 card border-b">
  <div class="max-w-7xl mx-auto px-4 py-3 flex items-center gap-3 flex-wrap">
    <div class="text-xl font-extrabold accent-text flex items-center gap-1">🚗 AutoGear</div>
    <div class="flex-1 min-w-[180px] relative">
      <input id="searchInput" type="text" placeholder="Search car accessories..." class="w-full rounded-full px-4 py-2 text-sm outline-none focus:ring-2" style="--tw-ring-color:var(--accent)">
    </div>
    <button onclick="openCart()" class="relative accent text-white rounded-full px-4 py-2 text-sm font-semibold flex items-center gap-2">
      🛒 Cart <span id="cartCount" class="bg-white text-black rounded-full w-5 h-5 text-xs flex items-center justify-center">0</span>
    </button>
  </div>
  <div id="chipRow" class="max-w-7xl mx-auto px-4 pb-3 flex gap-2 overflow-x-auto"></div>
</header>

<main class="max-w-7xl mx-auto px-4 py-6">
  <div id="grid" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-4"></div>
  <p id="emptyMsg" class="hidden text-center muted py-16">No products match your search.</p>
</main>

<!-- Cart Drawer -->
<div id="cartOverlay" class="fixed inset-0 bg-black/40 z-40 hidden fade" onclick="closeCart()"></div>
<div id="cartDrawer" class="fixed top-0 right-0 h-full w-full sm:w-96 card z-50 translate-x-full drawer flex flex-col">
  <div class="flex items-center justify-between p-4 border-b border-[var(--border)]">
    <h2 class="font-bold text-lg">Your Cart</h2>
    <button onclick="closeCart()" class="text-2xl leading-none">&times;</button>
  </div>
  <div id="cartItems" class="flex-1 overflow-y-auto p-4 space-y-3"></div>
  <div class="p-4 border-t border-[var(--border)] space-y-2">
    <div class="flex justify-between font-semibold"><span>Subtotal</span><span id="cartSubtotal">$0.00</span></div>
    <button onclick="openCheckout()" class="w-full accent text-white rounded-lg py-3 font-semibold">Checkout</button>
  </div>
</div>

<!-- Checkout Modal -->
<div id="checkoutOverlay" class="fixed inset-0 bg-black/50 z-50 hidden items-center justify-center p-4 fade">
  <div class="card rounded-xl w-full max-w-lg max-h-[90vh] overflow-y-auto">
    <div class="flex items-center justify-between p-4 border-b border-[var(--border)]">
      <h2 class="font-bold text-lg">Checkout</h2>
      <button onclick="closeCheckout()" class="text-2xl leading-none">&times;</button>
    </div>
    <div class="p-4">
      <div class="flex gap-2 mb-4">
        <button id="tabCard" onclick="setPayTab('card')" class="flex-1 py-2 rounded-lg font-semibold chip active">💳 Card</button>
        <button id="tabCod" onclick="setPayTab('cod')" class="flex-1 py-2 rounded-lg font-semibold chip">💵 Cash on Delivery</button>
      </div>
      <form id="checkoutForm" onsubmit="submitOrder(event)" class="space-y-3">
        <!-- Honeypot: invisible to real users, bots often fill every field -->
        <input type="text" id="honeypot" name="website" style="display:none" tabindex="-1" autocomplete="off">
        <input id="fullName" required placeholder="Full Name" class="w-full rounded-lg px-3 py-2 text-sm">
        <input id="phone" required placeholder="Phone Number" class="w-full rounded-lg px-3 py-2 text-sm">
        <div id="codFields" class="space-y-3 hidden">
          <input id="address" required placeholder="Delivery Address" class="w-full rounded-lg px-3 py-2 text-sm">
          <input id="deliveryTime" placeholder="Preferred Delivery Time (e.g. Weekday afternoons)" class="w-full rounded-lg px-3 py-2 text-sm">
        </div>
        <div id="cardFields" class="space-y-3">
          <p class="text-sm muted">You'll be redirected to a secure Stripe checkout page to complete your card payment — no card details are collected on this site.</p>
        </div>
        <div class="flex justify-between font-semibold pt-2"><span>Total</span><span id="checkoutTotal">$0.00</span></div>
        <button type="submit" id="placeOrderBtn" class="w-full accent text-white rounded-lg py-3 font-semibold">Continue to Payment</button>
      </form>
      <p id="orderSuccess" class="hidden text-center py-6 font-semibold accent-text">✅ Order placed! (demo — no real payment was processed)</p>
    </div>
  </div>
</div>

<script>
let cart = JSON.parse(localStorage.getItem('ag_cart')||'{}');
let activeCat = "All", searchTerm = "", buyNowMode = false, buyNowItem = null;

// Only creates a real client once you've swapped in your own Supabase URL/key above
const supabaseClient = (window.supabase && SUPABASE_URL.startsWith('http'))
  ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
  : null;

function saveCart(){ try{ localStorage.setItem('ag_cart', JSON.stringify(cart)); }catch(e){} }

function renderChips(){
  document.getElementById('chipRow').innerHTML = CATEGORIES.map(c =>
    `<button onclick="setCat('${c}')" class="chip ${c===activeCat?'active':''} rounded-full px-4 py-1.5 text-sm whitespace-nowrap">${c}</button>`
  ).join('');
}
function setCat(c){ activeCat=c; renderChips(); renderGrid(); }

function imgTag(img){
  const isReal = typeof img === 'string' && (img.startsWith('data:') || img.startsWith('http'));
  return isReal
    ? `<img src="${img}" alt="" class="w-full h-full object-cover">`
    : img;
}
function stars(r){
  let full=Math.round(r);
  return '★★★★★☆☆☆☆☆'.slice(5-full,10-full);
}

function renderGrid(){
  const q = searchTerm.trim().toLowerCase();
  const items = PRODUCTS.filter(p =>
    (activeCat==="All"||p.cat===activeCat) &&
    (!q || p.name.toLowerCase().includes(q) || p.desc.toLowerCase().includes(q))
  );
  document.getElementById('grid').innerHTML = items.map(p => `
    <div class="card rounded-xl overflow-hidden flex flex-col hover:shadow-lg transition-shadow">
      <div class="prod-img bg-[var(--bg)] overflow-hidden">${imgTag(p.img)}</div>
      <div class="p-3 flex flex-col flex-1 gap-1">
        <div class="text-sm font-semibold leading-snug">${p.name}</div>
        <div class="text-xs muted line-clamp-2">${p.desc}</div>
        <div class="text-xs star">${stars(p.rating)} <span class="muted">(${p.reviews})</span></div>
        <div class="font-bold mt-1">$${p.price.toFixed(2)}</div>
        <div class="mt-auto flex gap-2 pt-2">
          <button onclick="addToCart(${p.id})" class="flex-1 chip rounded-lg py-1.5 text-xs font-semibold">Add to Cart</button>
          <button onclick="buyNow(${p.id})" class="flex-1 accent text-white rounded-lg py-1.5 text-xs font-semibold">Buy Now</button>
        </div>
      </div>
    </div>`).join('');
  document.getElementById('emptyMsg').classList.toggle('hidden', items.length>0);
}

function addToCart(id){
  cart[id] = (cart[id]||0)+1;
  saveCart(); updateCartUI();
  const btn = event.target; btn.classList.add('scale-95'); setTimeout(()=>btn.classList.remove('scale-95'),150);
}
function changeQty(id, delta){
  cart[id] = (cart[id]||0)+delta;
  if(cart[id]<=0) delete cart[id];
  saveCart(); updateCartUI();
}
function cartTotal(){
  return Object.entries(cart).reduce((sum,[id,qty])=>{
    const p = PRODUCTS.find(x=>x.id==id); return sum + (p?p.price*qty:0);
  },0);
}
function updateCartUI(){
  const count = Object.values(cart).reduce((a,b)=>a+b,0);
  document.getElementById('cartCount').textContent = count;
  const wrap = document.getElementById('cartItems');
  const entries = Object.entries(cart);
  wrap.innerHTML = entries.length ? entries.map(([id,qty])=>{
    const p = PRODUCTS.find(x=>x.id==id); if(!p) return '';
    return `<div class="flex items-center gap-3">
      <div class="prod-img bg-[var(--bg)] rounded-lg w-14 h-14 text-xl overflow-hidden">${imgTag(p.img)}</div>
      <div class="flex-1">
        <div class="text-sm font-medium">${p.name}</div>
        <div class="text-xs muted">$${p.price.toFixed(2)} each</div>
      </div>
      <div class="flex items-center gap-2">
        <button onclick="changeQty(${p.id},-1)" class="chip w-6 h-6 rounded-full text-sm">-</button>
        <span class="text-sm w-4 text-center">${qty}</span>
        <button onclick="changeQty(${p.id},1)" class="chip w-6 h-6 rounded-full text-sm">+</button>
      </div>
    </div>`;
  }).join('') : '<p class="muted text-center py-10">Your cart is empty.</p>';
  document.getElementById('cartSubtotal').textContent = '$'+cartTotal().toFixed(2);
}

function openCart(){ document.getElementById('cartOverlay').classList.remove('hidden'); document.getElementById('cartDrawer').classList.remove('translate-x-full'); }
function closeCart(){ document.getElementById('cartOverlay').classList.add('hidden'); document.getElementById('cartDrawer').classList.add('translate-x-full'); }

function buyNow(id){
  buyNowMode = true; buyNowItem = {id, qty:1};
  openCheckout();
}
function openCheckout(){
  document.getElementById('checkoutOverlay').classList.remove('hidden');
  document.getElementById('checkoutOverlay').classList.add('flex');
  document.getElementById('orderSuccess').classList.add('hidden');
  document.getElementById('checkoutForm').classList.remove('hidden');
  const total = buyNowMode ? PRODUCTS.find(p=>p.id===buyNowItem.id).price : cartTotal();
  document.getElementById('checkoutTotal').textContent = '$'+total.toFixed(2);
  closeCart();
}
function closeCheckout(){
  document.getElementById('checkoutOverlay').classList.add('hidden');
  document.getElementById('checkoutOverlay').classList.remove('flex');
  buyNowMode = false; buyNowItem = null;
}
function setPayTab(tab){
  document.getElementById('tabCard').classList.toggle('active', tab==='card');
  document.getElementById('tabCod').classList.toggle('active', tab==='cod');
  document.getElementById('cardFields').classList.toggle('hidden', tab!=='card');
  document.getElementById('codFields').classList.toggle('hidden', tab!=='cod');
  document.getElementById('placeOrderBtn').textContent = tab==='card' ? 'Continue to Payment' : 'Place Order';
}

async function submitOrder(e){
  e.preventDefault();

  // Honeypot: real users never fill this (it's display:none). If it has a
  // value, silently pretend success and skip Supabase/Stripe entirely —
  // this keeps bots from ever touching your database or payment link.
  if(document.getElementById('honeypot').value){
    document.getElementById('checkoutForm').classList.add('hidden');
    document.getElementById('orderSuccess').classList.remove('hidden');
    setTimeout(closeCheckout, 1500);
    return;
  }

  const isCard = document.getElementById('tabCard').classList.contains('active');

  if(isCard){
    if(!STRIPE_PAYMENT_LINK.startsWith('http')){
      alert('Add your real Stripe Payment Link to the STRIPE_PAYMENT_LINK variable near the top of the file.');
      return;
    }
    window.location.href = STRIPE_PAYMENT_LINK;
    return;
  }

  // Cash on Delivery -> write the order straight to Supabase
  const btn = document.getElementById('placeOrderBtn');
  const originalLabel = btn.textContent;
  btn.disabled = true;
  btn.textContent = 'Placing order…';

  const order = {
    full_name: document.getElementById('fullName').value,
    phone: document.getElementById('phone').value,
    address: document.getElementById('address').value,
    delivery_time: document.getElementById('deliveryTime').value,
    items: buyNowMode
      ? [{ id: buyNowItem.id, qty: buyNowItem.qty }]
      : Object.entries(cart).map(([id,qty]) => ({ id:Number(id), qty })),
    total: buyNowMode ? PRODUCTS.find(p=>p.id===buyNowItem.id).price : cartTotal(),
    payment_method: 'cod',
    created_at: new Date().toISOString()
  };

  try{
    if(!supabaseClient) throw new Error('Add your real SUPABASE_URL and SUPABASE_ANON_KEY near the top of the file.');
    const { error } = await supabaseClient.from('orders').insert([order]);
    if(error) throw error;

    document.getElementById('checkoutForm').classList.add('hidden');
    document.getElementById('orderSuccess').classList.remove('hidden');
    if(!buyNowMode){ cart = {}; saveCart(); updateCartUI(); }
    setTimeout(closeCheckout, 2200);
  }catch(err){
    btn.disabled = false;
    btn.textContent = originalLabel;
    alert('Could not place order — please try again.\n(' + (err.message || err) + ')');
  }
}

document.getElementById('searchInput').addEventListener('input', e=>{ searchTerm = e.target.value; renderGrid(); });

renderChips(); renderGrid(); updateCartUI();
</script>
</body>
</html>
